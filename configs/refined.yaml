# Refined run: identical architecture, identical Table 1 hyperparameters.
# Changes only the four things listed in README section 5.1 -
# feature channels (still d=10), leave-one-out priors, dev-fitted threshold,
# and weight averaging. Nothing in Section 4 of the paper changes.
# Edit raw_csv to point at your copy of the ASSISTments file.

raw_csv: "~/Downloads/2012-2013-data-with-predictions-4-final.csv"

# ---- data scale ----
# The paper's runs were on a ~30k-interaction subset (hence 2.1-3.7 s per client
# per round). 300k gives noticeably better and more stable metrics at a cost of
# a few minutes per run on a GPU. Set to null to use the whole file.
max_interactions: 300000
min_interactions: 30
window_stride: 1
max_windows_per_client: 60000
partition_by: "learner"
dev_fraction: 0.15
test_fraction: 0.15
prior_smoothing: 15.0
leave_one_out_priors: true
feature_set: "refined"

# ---- model (Table 1) ----
seq_len: 20
n_features: 10
hidden: 128
layers: 2
dropout: 0.5

# ---- federated training (Table 1) ----
n_clients: 5
rounds: 100
local_epochs: 20
batch_size: 32
lr: 0.0005
grad_clip: 1.0
max_steps_per_epoch: 200
eval_every: 1

centralized_epochs: 20

# ---- runtime ----
seed: 1
device: "cuda"
preload_to_device: true

feature_mode: "causal"

out_dir: "results"
fig_dir: "figures"
tag: "refined"

# ---- the refinements ----
threshold_policy: "dev_kappa"    # cut-off fitted on dev; see metrics.py and README 5.1
class_weight: "none"
swa_last_k: 5
